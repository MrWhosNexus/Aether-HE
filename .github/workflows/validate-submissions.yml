name: Validate submissions

# Security guard for community board data. Runs on PRs (including from forks) and
# on pushes that touch keymaps or the UI. Uses the default `pull_request` trigger
# — NOT `pull_request_target` — so untrusted PR code runs with a read-only token
# and no access to repository secrets. Never add secrets or write permissions here.

on:
  pull_request:
    paths:
      - "**/keymap.json"
      - "tools/validate_keymap.py"
      - "tools/gen_boards_table.py"
      - "data/boards.json"
      - "README.md"
      - "ui/runtime_src/src/**"
      - "ui/runtime_src/workspaces/**"
      - "ui/layouts/**"
      - "data/board_registry.json"
      - "protocol*.py"
      - "drivers/**"
      - "tools/scan_contrib.py"
      - ".github/workflows/validate-submissions.yml"
  push:
    branches: [main]
    paths:
      - "**/keymap.json"
      - "tools/validate_keymap.py"
      - "tools/gen_boards_table.py"
      - "data/boards.json"
      - "README.md"
      - "ui/runtime_src/src/**"
      - "ui/runtime_src/workspaces/**"
      - "ui/layouts/**"
      - "data/board_registry.json"
      - "protocol*.py"
      - "drivers/**"

permissions:
  contents: read

jobs:
  validate-keymaps:
    name: Validate keymap.json files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every keymap.json against the strict schema
        shell: bash
        run: |
          shopt -s globstar nullglob
          maps=(**/keymap.json)
          if [ ${#maps[@]} -eq 0 ]; then
            echo "No keymap.json files found — nothing to validate."
            exit 0
          fi
          echo "Validating: ${maps[*]}"
          python tools/validate_keymap.py "${maps[@]}"
      - name: Check README boards table is in sync with data/boards.json
        run: python tools/gen_boards_table.py --check

  ui-xss-guard:
    name: Forbid raw-HTML sinks in the UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if dangerouslySetInnerHTML / innerHTML appear in UI source
        shell: bash
        run: |
          # The WebView exposes window.pywebview.api (the HID bridge), so any XSS
          # in the UI is arbitrary device control. Keymap-derived strings must
          # only ever be rendered as escaped text. Block raw-HTML sinks entirely.
          # Scan BOTH authored, shipped source trees: src/ AND workspaces/ —
          # build_runtime.py compiles workspaces/*.jsx into the runtime too, so
          # a sink there ships just the same. (vendor/ is the unmodified React/
          # Babel libs, which legitimately use innerHTML — not scanned.)
          if grep -rnE "dangerouslySetInnerHTML|\.innerHTML|insertAdjacentHTML|outerHTML" ui/runtime_src/src ui/runtime_src/workspaces; then
            echo "::error::Raw-HTML sink found in UI source. Render untrusted strings as text only (no innerHTML / dangerouslySetInnerHTML)."
            exit 1
          fi
          echo "OK: no raw-HTML sinks in ui/runtime_src/src or ui/runtime_src/workspaces."

  board-code-scan:
    name: Board code may not reach network, processes or files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan protocol*.py and drivers/ (AST only, nothing is imported or run)
        run: python tools/scan_contrib.py

  no-built-output:
    name: PRs may not ship built UI or installer files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if the PR changes CI-built files
        shell: bash
        # PR metadata goes through env, never an expression inside the script, so no
        # PR-controlled text can become shell code.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- ui/index_runtime.html 'ui/runtime_src/build/' 'dist/' || true)
          if [ -n "$changed" ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "$changed"
            echo "::error::Built files come from our CI, never from a contribution. Remove them from the PR; edit ui/runtime_src/src or workspaces instead."
            exit 1
          fi
          echo "OK"
