# .github/workflows/board-bot.yml
name: Board draft bot

# SECURITY: the bot sends a PUBLIC issue's text to a model and pushes the
# result with a write token, so it runs only when a MAINTAINER asks for it:
# adding the `bot-draft` label (issue authors cannot add labels; the issue
# template's own labels are different), or a manual dispatch. It commits data
# files only; the drafted adapter goes into the PR body as text.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to draft"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  draft:
    # Runs only when a maintainer applies the `bot-draft` label (applying labels
    # needs triage access; the issue template applies only new-board/needs-triage)
    # or dispatches it by hand. A stranger's issue can never start the bot, spend
    # API credit, or push model-written code. Never interpolate issue text into
    # a `run:` step below.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'bot-draft'
    concurrency:
      group: board-bot-${{ github.event.issue.number || github.event.inputs.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draft board support
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || github.event.inputs.issue }}
        run: |
          git config user.name "aether-board-bot"
          git config user.email "bot@users.noreply.github.com"
          # Bind the run to the body the maintainer saw when labelling: an
          # edit after the label makes the bot refuse (board_bot.run).
          EXPECT=""
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            EXPECT=$(python -c "import hashlib,json,os; e=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')); print(hashlib.sha256(((e.get('issue') or {}).get('body') or '').encode('utf-8')).hexdigest())")
          fi
          python tools/board_bot.py --issue "$ISSUE" ${EXPECT:+--expect-body-sha256 "$EXPECT"}
